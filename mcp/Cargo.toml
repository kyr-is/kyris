[package]
name = "kyris-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Kyris stdio MCP wrapper: JSON-RPC interposition with AgentPact policy enforcement"

[[bin]]
name = "kyris-mcp"
path = "src/main.rs"

[dependencies]
kyris-core = { workspace = true }
kyris-agentpact-client = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "process", "io-util", "io-std", "net", "sync", "signal", "time"] }
serde_json = { workspace = true }
nix = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"
