[advisories]
version = 2
# Acknowledged unmaintained advisories pulled in transitively by `syntect`
# (via `two-face`). No safe upgrade exists upstream; both libs are usable
# but their maintainers have stepped away.
#   - RUSTSEC-2025-0141: bincode 1.3.3 (team stopped development)
#   - RUSTSEC-2024-0320: yaml-rust 0.4.5 (maintainer unreachable)
# Re-evaluate when syntect cuts a release that swaps these out.
ignore = [
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0320",
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
deny = [
    { name = "hmac" },
    { name = "sha2" },
    { name = "ed25519-dalek" },
    { name = "serde_yml" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/kyr-is/agentpact.git"]
