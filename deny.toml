# SPDX-License-Identifier: Apache-2.0
[advisories]
version = 2
ignore = [
    # GTK3 bindings pulled transitively by tray-icon — unmaintained, no upgrade path.
    # Linux-only, not compiled on macOS. Will resolve when tray-icon migrates to GTK4.
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys
    "RUSTSEC-2024-0370", # proc-macro-error (dep of gtk3-macros)
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
deny = [
    { name = "hmac" },
    { name = "sha2" },
    { name = "ed25519-dalek" },
    { name = "serde_yml" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
