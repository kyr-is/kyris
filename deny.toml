[advisories]
version = 2
# No advisory exemptions — all previously-ignored GTK3 advisories were
# from tray-icon/tao transitive deps that are now removed.
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
deny = [
    { name = "hmac" },
    { name = "sha2" },
    { name = "ed25519-dalek" },
    { name = "serde_yml" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/kyr-is/agentpact.git"]
