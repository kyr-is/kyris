# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy, llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-llvm-cov

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Deny check
        run: cargo deny check

      - name: Test + coverage
        run: cargo llvm-cov --all-features

      - name: Bench (regression gate)
        run: cargo bench --workspace -- --test

  cross-repo:
    runs-on: macos-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Install agentpactd (pinned release)
        run: ./scripts/install-agentpact-ci.sh

      - name: Cross-repo integration tests
        run: cargo test -- --ignored --test-threads=1 cross_repo
