name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure git auth for private deps
        run: git config --global url."https://x-access-token:${{ secrets.KYRIS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy, llvm-tools-preview

      - if: env.ACT != 'true'
        uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-llvm-cov

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Deny check
        run: cargo deny check

      - name: Test with coverage
        run: |
          cargo llvm-cov --all-features
          cargo test --benches -p kyrisd

      - name: Update coverage gist
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          COVERAGE_GIST_ID: 2a8a7c5f533e65aa92dc3c0478aac964
        run: |
          cargo llvm-cov report --color never | tee coverage-report.txt
          COVERAGE=$(grep -oE '[0-9]+\.[0-9]+%' coverage-report.txt | tail -1)
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"$COVERAGE\",\"color\":\"brightgreen\"}" > coverage.json
          gh gist edit $COVERAGE_GIST_ID -f coverage.json coverage.json
