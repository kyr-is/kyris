name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    outputs:
      app_sha256: ${{ steps.checksums.outputs.app_sha256 }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - name: Configure git auth for private deps
        run: git config --global url."https://x-access-token:${{ secrets.KYRIS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # Fail fast (before doing any expensive work) if any signing or
      # notarization secret is missing. Skipping signing on a tagged
      # release would silently produce an unsigned bundle and ship it as
      # the official artifact — users would hit Gatekeeper popups and
      # we wouldn't know until reports came in. Better to fail loudly.
      - name: Verify signing secrets are present
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=()
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_IDENTITY \
                     APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Tagged release missing required signing secrets: ${missing[*]}"
            echo "::error::Set them at https://github.com/kyr-is/kyris/settings/secrets/actions"
            exit 1
          fi
          echo "All signing secrets present."

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      # --- Compilation cache (mirrors ci.yml) ----------------------------------
      # Without this, every release rebuilds bundled-duckdb (libduckdb-sys C++) +
      # all deps from cold. We cache the cargo registry (dep sources) + the
      # sccache per-invocation store, and SHARE ci.yml's exact sccache cache key
      # on purpose: releases are infrequent, so an isolated release cache would
      # hit GitHub's 7-day idle eviction and be cold every time — whereas main's
      # store is kept warm by CI on every push, and a tag run can restore the
      # default branch's caches. sccache is content-hashed, so sharing is safe
      # (no wrong hits). Note the realistic reuse is the duckdb C++ objects: the
      # Rust crate compiles differ from CI (release profile lto/opt + explicit
      # --target both change the content hash), so those re-run + re-cache.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
          cache-all-crates: "true"

      - uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Configure sccache
        id: sccache
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "CC=sccache cc"
            echo "CXX=sccache c++"
            echo "SCCACHE_LOG=warn"
            # sccache can't cache `-C incremental` (UnhandledCompile); release
            # disables it by default, but set it explicitly to be safe.
            echo "CARGO_INCREMENTAL=0"
            echo "SCCACHE_BASEDIR=${{ github.workspace }}"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache"
          } >> "$GITHUB_ENV"
          # libduckdb-sys version drives the cache key — a code change never
          # evicts the compiled-duckdb black box; a version bump rotates it.
          ver=$(awk '/^name = "libduckdb-sys"/{getline; gsub(/[" ]/,"",$3); print $3; exit}' Cargo.lock)
          echo "duckdb_ver=$ver" >> "$GITHUB_OUTPUT"

      # SAME key prefix as ci.yml's "Persist the sccache store" step, so a tagged
      # release restores main's warm store (default-branch cache access). The
      # unique run_id suffix + duckdb-version restore-key is ci.yml's pattern.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ runner.os }}-duckdb${{ steps.sccache.outputs.duckdb_ver }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-duckdb${{ steps.sccache.outputs.duckdb_ver }}-

      - name: Start sccache server
        run: |
          sccache --stop-server || true
          sccache --start-server

      # Requires outbound network: kyris-types' build.rs fetches the live LiteLLM
      # pricing feed at build time (PricingTable::bundled) and FAILS BY DESIGN if
      # it's unreachable — no fallback. So a release is cut against the pricing
      # table current as of build time.
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      # Read this on the first real release: cumulative cache requests vs hits.
      # If the store is bloating without hitting (duckdb objects miss across the
      # release-profile/--target boundary), split release onto its own cache key.
      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Pre-bundle prep
        run: |
          for bin in kyris kyrisd kyris-mcp kyris-hook; do
            xattr -d com.apple.quarantine "target/${{ matrix.target }}/release/$bin" 2>/dev/null || true
          done

      # Wrap all four binaries in Kyrisd.app. The bundle ships
      # ad-hoc-signed from build-app-bundle.sh; the next step replaces
      # that signature with the real Developer ID one. All four
      # binaries live inside Contents/MacOS/, so one bundle = one
      # signing + one notarization covering everything.
      - name: Build Kyrisd.app bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p target/bundle-staging
          VERSION_NO_V="${VERSION#v}"
          COMMIT=$(git rev-parse --short HEAD)
          BINARY_DIR="target/${{ matrix.target }}/release" \
            VERSION="$VERSION_NO_V" COMMIT="$COMMIT" \
            OUT_DIR=target/bundle-staging \
            bash scripts/build-app-bundle.sh

      - name: Import signing identity
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm /tmp/cert.p12

      - name: Codesign bundle with Developer ID
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: |
          # --deep recurses into Contents/MacOS/ and signs every
          # embedded binary (kyrisd, kyris, kyris-mcp, kyris-hook) with
          # the Developer ID. One sign, four binaries covered.
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_IDENTITY" \
            target/bundle-staging/Kyrisd.app
          codesign --verify --deep --strict --verbose=2 \
            target/bundle-staging/Kyrisd.app

      - name: Notarize and staple bundle
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # One notarization submission. Apple's notarization of the
          # bundle covers all four embedded binaries — when Gatekeeper
          # checks any of them, it sees they're part of a notarized
          # bundle with a stapled ticket and accepts.
          cd target/bundle-staging
          ditto -c -k --keepParent Kyrisd.app Kyrisd-for-notarization.zip
          xcrun notarytool submit Kyrisd-for-notarization.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          rm Kyrisd-for-notarization.zip
          xcrun stapler staple Kyrisd.app
          xcrun stapler validate Kyrisd.app
          spctl --assess --type execute --verbose Kyrisd.app

      - name: Binary size check
        run: |
          for bin in kyris kyrisd kyris-mcp kyris-hook; do
            SIZE=$(stat -f%z "target/${{ matrix.target }}/release/$bin")
            echo "$bin: $((SIZE / 1024 / 1024))MB ($SIZE bytes)"
          done
          KYRIS_SIZE=$(stat -f%z "target/${{ matrix.target }}/release/kyris")
          if [ "$KYRIS_SIZE" -gt 31457280 ]; then echo "::error::kyris exceeds 30MB"; exit 1; fi
          KYRISD_SIZE=$(stat -f%z "target/${{ matrix.target }}/release/kyrisd")
          if [ "$KYRISD_SIZE" -gt 31457280 ]; then echo "::error::kyrisd exceeds 30MB"; exit 1; fi
          HOOK_SIZE=$(stat -f%z "target/${{ matrix.target }}/release/kyris-hook")
          if [ "$HOOK_SIZE" -gt 1048576 ]; then echo "::error::kyris-hook exceeds 1MB"; exit 1; fi
          MCP_SIZE=$(stat -f%z "target/${{ matrix.target }}/release/kyris-mcp")
          if [ "$MCP_SIZE" -gt 5242880 ]; then echo "::error::kyris-mcp exceeds 5MB"; exit 1; fi

      - name: Generate contract schemas
        run: cargo run -p xtask -- schemas

      # build-tar.sh produces a single artifact:
      #   Kyrisd-${VERSION}-${TARGET}.app.tar.gz  — the Kyrisd.app
      #   bundle that both install.sh and the Homebrew Cask consume.
      #   All four binaries (kyris, kyrisd, kyris-mcp, kyris-hook)
      #   live inside Contents/MacOS/; the launchd plist template
      #   and the build-time Cargo.toml ship in Contents/Resources/.
      #
      # PREBUILT_APP makes build-tar.sh tar OUR signed + notarized
      # bundle instead of rebuilding an ad-hoc-signed one.
      - name: Build distribution tarball
        env:
          VERSION: ${{ github.ref_name }}
          BINARY_DIR: target/${{ matrix.target }}/release
          TARGET: ${{ matrix.target }}
          PREBUILT_APP: target/bundle-staging/Kyrisd.app
        run: bash scripts/build-tar.sh

      - name: Generate checksums
        id: checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="${{ matrix.target }}"
          echo "app_sha256=$(awk '{print $1}' "target/Kyrisd-${VERSION}-${TARGET}.app.tar.gz.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/Kyrisd-*-aarch64-apple-darwin.app.tar.gz
            target/Kyrisd-*-aarch64-apple-darwin.app.tar.gz.sha256
            target/schemas/*.yaml
            target/schemas/*.json

  homebrew:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve asset ID
        id: assets
        env:
          GH_TOKEN: ${{ secrets.KYRIS_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_JSON=$(gh api "repos/kyr-is/kyris/releases/tags/${GITHUB_REF_NAME}")

          # The cask consumes the .app.tar.gz, not the legacy
          # bare-binary tarball, so we point homebrew-tap at the bundle
          # asset and its sha256.
          APP_TAR_NAME="Kyrisd-${VERSION}-aarch64-apple-darwin.app.tar.gz"
          ASSET_ID=$(echo "$RELEASE_JSON" | jq -r ".assets[] | select(.name == \"${APP_TAR_NAME}\") | .id")
          if [ -z "$ASSET_ID" ] || [ "$ASSET_ID" = "null" ]; then
            echo "::error::Could not find asset ${APP_TAR_NAME}"
            exit 1
          fi
          echo "asset_id=$ASSET_ID" >> "$GITHUB_OUTPUT"

      - name: Trigger homebrew-tap update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.KYRIS_TOKEN }}
          repository: kyr-is/homebrew-tap
          event-type: update-cask
          client-payload: '{"tool": "kyris", "version": "${{ github.ref_name }}", "sha256": "${{ needs.build.outputs.app_sha256 }}", "asset_id": "${{ steps.assets.outputs.asset_id }}"}'
