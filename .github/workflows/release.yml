name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    outputs:
      sha256: ${{ steps.checksums.outputs.sha256 }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - name: Configure git auth for private deps
        run: git config --global url."https://x-access-token:${{ secrets.KYRIS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Codesign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        if: env.APPLE_CERTIFICATE != ''
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          for bin in kyris kyrisd kyris-mcp kyris-hook; do
            codesign --sign "$APPLE_IDENTITY" --options runtime --timestamp \
              "target/${{ matrix.target }}/release/$bin"
          done

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        if: env.APPLE_ID != ''
        run: |
          for bin in kyris kyrisd kyris-mcp kyris-hook; do
            zip -j "$bin.zip" "target/${{ matrix.target }}/release/$bin"
            xcrun notarytool submit --wait \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              "$bin.zip"
            xcrun stapler staple "target/${{ matrix.target }}/release/$bin"
            rm "$bin.zip"
          done

      - name: Binary size check
        run: |
          for bin in kyris kyrisd kyris-mcp kyris-hook; do
            SIZE=$(stat -f%z "target/${{ matrix.target }}/release/$bin")
            echo "$bin: $((SIZE / 1024 / 1024))MB ($SIZE bytes)"
          done
          KYRIS_SIZE=$(stat -f%z "target/${{ matrix.target }}/release/kyris")
          if [ "$KYRIS_SIZE" -gt 31457280 ]; then echo "::error::kyris exceeds 30MB"; exit 1; fi
          KYRISD_SIZE=$(stat -f%z "target/${{ matrix.target }}/release/kyrisd")
          if [ "$KYRISD_SIZE" -gt 31457280 ]; then echo "::error::kyrisd exceeds 30MB"; exit 1; fi
          HOOK_SIZE=$(stat -f%z "target/${{ matrix.target }}/release/kyris-hook")
          if [ "$HOOK_SIZE" -gt 1048576 ]; then echo "::error::kyris-hook exceeds 1MB"; exit 1; fi
          MCP_SIZE=$(stat -f%z "target/${{ matrix.target }}/release/kyris-mcp")
          if [ "$MCP_SIZE" -gt 5242880 ]; then echo "::error::kyris-mcp exceeds 5MB"; exit 1; fi

      - name: Generate contract schemas
        run: cargo run -p xtask -- schemas

      - name: Create tarball
        run: |
          cd target/${{ matrix.target }}/release
          tar czf kyris-darwin-aarch64.tar.gz kyris kyrisd kyris-mcp kyris-hook

      - name: Generate checksums
        id: checksums
        run: |
          cd target/${{ matrix.target }}/release
          shasum -a 256 kyris-darwin-aarch64.tar.gz > kyris-darwin-aarch64.tar.gz.sha256
          echo "sha256=$(awk '{print $1}' kyris-darwin-aarch64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/${{ matrix.target }}/release/kyris-darwin-aarch64.tar.gz
            target/${{ matrix.target }}/release/kyris-darwin-aarch64.tar.gz.sha256
            target/schemas/*.yaml
            target/schemas/*.json

  homebrew:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger homebrew-tap update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.KYRIS_TOKEN }}
          repository: kyr-is/homebrew-tap
          event-type: update-formula
          client-payload: '{"tool": "kyris", "version": "${{ github.ref_name }}", "shas": {"darwin-aarch64": "${{ needs.build.outputs.sha256 }}"}}'
