# Default kyrisd configuration. Copied to $XDG_CONFIG_HOME/kyris/kyrisd.yaml
# on first run (default $HOME/.config/kyris/kyrisd.yaml). See
# kyris-core/src/paths.rs for the full XDG-aware layout.

apiVersion: kyris/v1

server:
  listen: "127.0.0.1:4710"
  # The inbound/operator auth keys are NOT stored here. They live as 0600 files
  # under $XDG_DATA_HOME/kyris/secret/ (default ~/.local/share/kyris/secret/),
  # minted on first run, preserved across uninstall/--reset-data, and read by
  # both kyrisd and the hook (single source of truth).
  max_request_body_bytes: 10485760
  drain_timeout_seconds: 30

tls:
  enabled: false

# Add a provider only to override its upstream URL. kyrisd holds no provider
# credential of its own — it forwards your agent's credential and stores none.
# providers:
#   - name: anthropic
#     upstream: "https://api.anthropic.com"
#     models:
#       - claude-4-opus
#       - claude-4-sonnet

mcp:
  enabled: false
  pending_timeout_seconds: 900
  # Each HTTP MCP server that may receive tools/call must set working_dir.
  # Kyris does not infer this from client connections.
  # servers:
  #   - name: example
  #     upstream: "http://localhost:8080"
  #     working_dir: "/path/to/project"

# Runaway guard. `max_tokens` caps the model OUTPUT tokens generated without any
# tool/shell/MCP call (a tool call resets the counter, so a working agent never
# trips). Crossing it doesn't kill the agent — it holds the next request and
# prompts a human "continue or stop?"; `decision_timeout_seconds` is how long
# that prompt waits for an answer before defaulting to stop (7 days, so the
# agent waits for a person rather than getting a surprise 429).
circuit_breaker:
  enabled: true
  max_tokens: 200000
  session_idle_minutes: 30
  decision_timeout_seconds: 604800

# The relay this install talks to. Two uses, neither requiring enrollment:
#   - pricing: `kyris install` and the daemon fetch the live price table from
#     `<url>/api/v1/pricing` (public) — so model names and costs work without
#     enrolling.
#   - enroll: `kyris enroll` uses this as the relay to enroll against when no
#     `--relay-url` / `KYRIS_RELAY_URL` is given.
# The dev patch overrides this to a local relay; `--relay-url` overrides per run.
relay:
  url: "https://relay.kyr.is"

# GitHub App for `kyris enroll`'s device flow. `client_id` is PUBLIC (it appears
# in the authorize URL), so it lives here; the dev patch overrides it to the dev
# app. `GITHUB_CLIENT_ID` env overrides per run. The client SECRET is never here
# — only the relay (server-side) needs it.
github:
  client_id: "Iv23liLeYbum0sNojXLs"

# Enrollment lives in credentials.json (run `kyris enroll`), not here.
# Sync is default-on for governed directories. Conventionally-private locations
# are always excluded: hidden/dot-prefixed dirs (~/.ssh, ~/.config, ~/.local…),
# owner-only (0700) dirs, and the macOS personal folders (~/Documents,
# ~/Downloads, ~/Pictures, ~/Music, ~/Movies, ~/Desktop, ~/Library, …).
# An empty `scope` syncs every other governed dir; set it to NARROW further,
# e.g. `["~/work", "~/src/myrepo"]`.
sync:
  scope: []

pricing:
  fetch_interval_hours: 6

stats:
  retention_days: 7
  flush_interval_ms: 1000
  flush_batch_size: 100
  channel_capacity: 10000
