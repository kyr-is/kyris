# Default kyrisd configuration. Copied to ~/.kyris/kyrisd.yaml on first run.

server:
  listen: "127.0.0.1:4710"
  # inbound_key is generated on first run if absent
  max_request_body_bytes: 10485760
  drain_timeout_seconds: 30

tls:
  enabled: false

# Add at least one provider to start accepting LLM requests.
# providers:
#   - name: anthropic
#     api_key: "sk-ant-..."
#     upstream: "https://api.anthropic.com"
#     models:
#       - claude-4-opus
#       - claude-4-sonnet

mcp:
  enabled: false
  pending_timeout_seconds: 60

circuit_breaker:
  enabled: true
  max_tokens: 200000
  session_idle_minutes: 30

sync:
  enabled: false
  scope: []

pricing:
  file: "config/pricing.yaml"
  fetch_interval_hours: 6

stats:
  retention_days: 7
  flush_interval_ms: 1000
  flush_batch_size: 100
  channel_capacity: 10000
