# Default kyrisd configuration. Copied to $XDG_CONFIG_HOME/kyris/kyrisd.yaml
# on first run (default $HOME/.config/kyris/kyrisd.yaml). See
# kyris-core/src/paths.rs for the full XDG-aware layout.

server:
  listen: "127.0.0.1:4710"
  # The inbound/operator auth keys are NOT stored here. They live as 0600 files
  # under $XDG_DATA_HOME/kyris/secret/ (default ~/.local/share/kyris/secret/),
  # minted on first run, preserved across uninstall/--reset-data, and read by
  # both kyrisd and the hook (single source of truth).
  max_request_body_bytes: 10485760
  drain_timeout_seconds: 30

tls:
  enabled: false

# Add at least one provider to start accepting LLM requests.
# providers:
#   - name: anthropic
#     api_key: "sk-ant-..."
#     upstream: "https://api.anthropic.com"
#     models:
#       - claude-4-opus
#       - claude-4-sonnet

mcp:
  enabled: false
  pending_timeout_seconds: 900
  # Each HTTP MCP server that may receive tools/call must set working_dir.
  # Kyris does not infer this from client connections.
  # servers:
  #   - name: example
  #     upstream: "http://localhost:8080"
  #     working_dir: "/path/to/project"

circuit_breaker:
  enabled: true
  max_tokens: 200000
  session_idle_minutes: 30

# The relay this install talks to. Two uses, neither requiring enrollment:
#   - pricing: `kyris install` and the daemon fetch the live price table from
#     `<url>/api/v1/pricing` (public) — so model names and costs work without
#     enrolling.
#   - enroll: `kyris enroll` uses this as the relay to enroll against when no
#     `--relay-url` / `KYRIS_RELAY_URL` is given.
# The dev patch overrides this to a local relay; `--relay-url` overrides per run.
relay:
  url: "https://relay.kyr.is"

# Enrollment lives in credentials.json (run `kyris enroll`), not here.
# `scope` only narrows which directories' events sync (empty = all).
sync:
  scope: []

pricing:
  fetch_interval_hours: 6

stats:
  retention_days: 7
  flush_interval_ms: 1000
  flush_batch_size: 100
  channel_capacity: 10000
