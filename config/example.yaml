# yaml-language-server: $schema=https://kyr-is.github.io/kyris/config.json
# Example kyrisd.yaml with all configuration options documented.

server:
  listen: "127.0.0.1:4710"
  # inbound_key / operator_key are NOT config — they live as 0600 files under
  # ~/.local/share/kyris/secret/, minted on first run.
  max_request_body_bytes: 10485760                # 10MB
  drain_timeout_seconds: 30

tls:
  enabled: false
  cert_path: ""
  key_path: ""

providers:
  # kyrisd holds no provider credential of its own — it forwards the caller's
  # (your agent's) credential to the upstream and stores none. Configure only
  # the upstream here.
  - name: anthropic
    upstream: "https://api.anthropic.com"
    models:
      - claude-4-opus
      - claude-4-sonnet
    timeout_seconds: 30
    streaming_timeout_seconds: 300

  - name: openai
    upstream: "https://api.openai.com"
    models:
      - gpt-4o
      - gpt-4o-mini

  - name: google
    upstream: "https://generativelanguage.googleapis.com"
    models:
      - gemini-2.5-pro
      - gemini-2.5-flash

mcp:
  enabled: true
  pending_timeout_seconds: 900
  servers:
    - name: github
      upstream: "http://localhost:8080"
      working_dir: "/path/to/project"
    - name: database
      upstream: "http://localhost:8081"
      working_dir: "/path/to/project"

# Runaway guard. `max_tokens` caps model OUTPUT tokens generated without any
# tool/shell/MCP call (a tool call resets the counter). Crossing it holds the
# next request and prompts a human "continue or stop?" rather than auto-killing;
# `decision_timeout_seconds` is how long that prompt waits before defaulting to
# stop (7 days). Either answer clears the counter.
circuit_breaker:
  enabled: true
  max_tokens: 200000
  session_idle_minutes: 30
  decision_timeout_seconds: 604800

# The relay this install talks to (the single home for the relay URL — NOT in
# credentials.json). Read by the daemon at runtime (pricing fetch from
# <url>/api/v1/pricing, and event sync), and by `kyris enroll` as the relay to
# enroll against when no `--relay-url` / `KYRIS_RELAY_URL` is given. Neither use
# requires enrollment for pricing. Override per `kyris enroll` with `--relay-url`
# (e.g. dev → local relay, or a self-hosted/enterprise relay).
relay:
  url: "https://relay.kyr.is"

# Enrollment lives in credentials.json (run `kyris enroll`), not here.
# `scope` only narrows which directories' events sync (empty = all).
sync:
  scope: []
  # Example: scope: ["~/work/*", "~/corp/*"]

pricing:
  fetch_interval_hours: 6

stats:
  retention_days: 7
  flush_interval_ms: 1000
  flush_batch_size: 100
  channel_capacity: 10000
