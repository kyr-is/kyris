[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Development tasks for the Kyris workspace."
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
kyris-types = { path = "../types", features = ["schema"] }
schemars = { workspace = true }
serde_json = { workspace = true }
# Explicitly authorized GA exception (per internal architecture policy).
# serde-saphyr is still 0.0.x; no GA alternative provides the same YAML+serde
# integration. Used by the schema-dump task for round-trip validation.
serde-saphyr = { workspace = true }
