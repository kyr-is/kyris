[package]
name = "kyris-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure schema and serialization types for the Kyris workspace. No I/O, no runtime, no filesystem."

[features]
openapi = ["utoipa"]
schema = ["schemars"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# Explicitly authorized GA exception per forest/03-architecture.md §0.4 #1.
# serde-saphyr is still 0.0.x; no GA alternative provides the same YAML+serde
# integration. Used here only for test fixtures and the bundled pricing
# include_str! parsing — no production runtime dependency.
serde-saphyr = { workspace = true }
utoipa = { version = "5.4", optional = true }
schemars = { version = "1.2", optional = true }

[dev-dependencies]
tempfile = "3"
